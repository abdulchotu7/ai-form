name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Save built extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: dist/

  deliver:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the exact build
        uses: actions/download-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: dist/

      - name: Pack one shippable zip
        run: cd dist && zip -r ../extension-${{ github.sha }}.zip .

      - name: Register the package
        uses: actions/upload-artifact@v4
        with:
          name: extension-package-${{ github.sha }}
          path: extension-${{ github.sha }}.zip
